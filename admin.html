// ─── REEMPLAZÁ ESTE UID CON EL TUYO DE FIREBASE ───────────────────────
// Para verlo: andá a Firebase Console > Authentication > Users > copiá tu UID
var ADMIN_UID = '15qMufW55FWuX4WMCoGRoHhRGaD2';
var WA = '5492804585359';
// ──────────────────────────────────────────────────────────────────────

var db = firebase.firestore();
var currentAdmin = null;
var allStats = {};

firebase.auth().onAuthStateChanged(function(user){
  if(!user){
    showScreen('login');
    return;
  }
  // Verificar si es admin
  db.collection('admins').doc(user.uid).get().then(function(doc){
    if(doc.exists || user.uid === ADMIN_UID){
      currentAdmin = user;
      document.getElementById('admin-name').textContent = user.displayName || user.email;
      var av = document.getElementById('admin-avatar');
      if(user.photoURL){ av.src=user.photoURL; av.style.display='block'; }
      showScreen('panel');
      loadTab('dashboard');
    } else {
      showScreen('denied');
    }
  }).catch(function(){
    // Si no existe la colección admins, usar UID hardcodeado
    if(user.uid === ADMIN_UID){
      currentAdmin = user;
      document.getElementById('admin-name').textContent = user.displayName || user.email;
      showScreen('panel');
      loadTab('dashboard');
    } else {
      showScreen('denied');
    }
  });
});

function loginConGoogle(){
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
}
function logout(){
  firebase.auth().signOut();
  showScreen('login');
}
function showScreen(s){
  document.getElementById('screen-login').style.display = s==='login'?'flex':'none';
  document.getElementById('screen-denied').style.display = s==='denied'?'flex':'none';
  document.getElementById('screen-panel').style.display = s==='panel'?'flex':'none';
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0F0F11;color:#FAFAFA;min-height:100vh}

/* SCREENS */
.screen{display:none;min-height:100vh;align-items:center;justify-content:center}
.screen-card{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:20px;padding:2.5rem;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.screen-card h1{font-size:1.4rem;font-weight:700;margin-bottom:0.5rem}
.screen-card p{font-size:0.875rem;color:#8A8479;line-height:1.6;margin-bottom:1.75rem}

/* PANEL LAYOUT */
#screen-panel{display:none;flex-direction:column;min-height:100vh}
.admin-header{background:#1A1814;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 1.5rem;height:56px;display:flex;align-items:center;gap:14px;flex-shrink:0;position:sticky;top:0;z-index:100}
.admin-logo{width:28px;height:28px;border-radius:6px;object-fit:cover}
.admin-title{font-size:0.9rem;font-weight:700;color:#fff;letter-spacing:-0.01em}
.admin-badge{background:#2D6A4F;color:#fff;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.05em}
.admin-user{margin-left:auto;display:flex;align-items:center;gap:8px}
.admin-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,0.2);display:none}
.admin-name{font-size:0.8rem;color:rgba(255,255,255,0.7);font-weight:500}
.btn-logout{background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);border-radius:7px;padding:5px 12px;font-size:0.75rem;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s}
.btn-logout:hover{background:rgba(255,255,255,0.08);color:#fff}

/* SIDEBAR + CONTENT */
.panel-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#141416;border-right:1px solid rgba(255,255,255,0.06);padding:1rem 0;flex-shrink:0;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:0.85rem;font-weight:500;color:rgba(255,255,255,0.5);transition:all 0.15s;border-left:3px solid transparent;user-select:none}
.sidebar-item:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.85)}
.sidebar-item.active{color:#fff;background:rgba(45,106,79,0.15);border-left-color:#2D6A4F}
.sidebar-icon{font-size:1.1rem;flex-shrink:0}
.sidebar-sep{height:1px;background:rgba(255,255,255,0.06);margin:8px 16px}
.content{flex:1;overflow-y:auto;padding:2rem 2rem 4rem;background:#0F0F11}

/* CARDS & STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:2rem}
.stat-card{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:12px;padding:1.25rem}
.stat-label{font-size:0.72rem;color:#8A8479;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.stat-value{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:#FAFAFA}
.stat-sub{font-size:0.75rem;color:#8A8479;margin-top:4px}
.stat-card.green .stat-value{color:#4ADE80}
.stat-card.blue .stat-value{color:#60A5FA}
.stat-card.orange .stat-value{color:#FB923C}
.stat-card.purple .stat-value{color:#C084FC}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.section-title{font-size:1.1rem;font-weight:700;color:#FAFAFA}
.section-sub{font-size:0.82rem;color:#8A8479;margin-top:3px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;font-size:0.85rem;font-weight:600;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all 0.15s}
.btn-primary{background:#2D6A4F;color:#fff}
.btn-primary:hover{background:#1B4332}
.btn-danger{background:#7F1D1D;color:#FCA5A5;border:1px solid #B91C1C}
.btn-danger:hover{background:#B91C1C;color:#fff}
.btn-secondary{background:#2A2A2E;color:#D4D4D8;border:1px solid #3A3A3E}
.btn-secondary:hover{background:#3A3A3E;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#1ebe5d}
.btn-sm{padding:6px 12px;font-size:0.78rem}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:0.78rem;font-weight:600;color:#A1A1AA}
.field input,.field select,.field textarea{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:8px;padding:9px 12px;font-size:0.875rem;font-family:'Outfit',sans-serif;color:#FAFAFA;outline:none;transition:border-color 0.15s;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2D6A4F;box-shadow:0 0 0 3px rgba(45,106,79,0.15)}
.field textarea{resize:vertical;min-height:80px}
.field select option{background:#1C1C1F}

/* FORM CARD */
.form-card{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.form-card h3{font-size:0.9rem;font-weight:700;color:#FAFAFA;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid #2A2A2E}

/* TABLE */
.table-wrap{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:12px;overflow:hidden}
.table-header{display:grid;padding:10px 16px;background:#141416;font-size:0.72rem;font-weight:700;color:#8A8479;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #2A2A2E}
.table-row{display:grid;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.1s;align-items:center}
.table-row:last-child{border:none}
.table-row:hover{background:rgba(255,255,255,0.03)}
.table-empty{text-align:center;padding:3rem;color:#8A8479;font-size:0.875rem}

/* BADGES */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;border:1px solid}
.pill-green{background:#052e16;color:#4ADE80;border-color:#166534}
.pill-red{background:#450a0a;color:#F87171;border-color:#7F1D1D}
.pill-yellow{background:#422006;color:#FCD34D;border-color:#92400E}
.pill-blue{background:#0c1a3d;color:#93C5FD;border-color:#1E3A8A}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:#2D6A4F;color:#fff;padding:12px 20px;border-radius:10px;font-size:0.875rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:9999;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#7F1D1D}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:500;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal-box{background:#1C1C1F;border:1px solid #2A2A2E;border-radius:16px;padding:1.75rem;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeUp 0.25s ease}
.modal-box h3{font-size:1rem;font-weight:700;margin-bottom:1.25rem;color:#FAFAFA}
.modal-close-btn{position:absolute;top:1rem;right:1rem;background:#2A2A2E;border:none;color:#8A8479;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center}

/* LOGIN BTN */
.btn-google{width:100%;padding:12px;background:#fff;color:#1A1814;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.15s}
.btn-google:hover{background:#F5F5F5}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen" style="display:flex">
  <div class="screen-card">

<!-- PANEL PRINCIPAL -->
<div id="screen-panel" style="flex-direction:column;min-height:100vh">

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
var db = firebase.firestore();
var WA = '5492804585359';

function toast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function(){ t.className = 'toast'; }, 3000);
}

function fmtPeso(n){ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0); }
function fmtFecha(ts){ return ts ? ts.toDate().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; }

function setActiveTab(name){
  document.querySelectorAll('.sidebar-item').forEach(function(el){ el.classList.remove('active'); });
  var el = document.getElementById('tab-'+name);
  if(el) el.classList.add('active');
}

function loadTab(name){
  setActiveTab(name);
  var c = document.getElementById('main-content');
  c.innerHTML = '<div style="text-align:center;padding:4rem;color:#8A8479"><div style="width:28px;height:28px;border:2px solid #2A2A2E;border-top-color:#2D6A4F;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto 1rem"></div>Cargando...</div>';
  if(name === 'dashboard') loadDashboard();
  else if(name === 'ofertas') loadOfertas();
  else if(name === 'cupones') loadCupones();
  else if(name === 'suscriptores') loadSuscriptores();
  else if(name === 'presupuestos') loadPresupuestos();
}

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
function loadDashboard(){
  var c = document.getElementById('main-content');
  var totalPres = 0, montoPres = 0, totalSubs = 0, totalOfertas = 0, totalCupones = 0;

  Promise.all([
    db.collection('presupuestos').get(),
    db.collection('suscripciones').get(),
    db.collection('ofertas').get(),
    db.collection('cupones').get()
  ]).then(function(results){
    totalPres = results[0].size;
    results[0].forEach(function(d){ montoPres += d.data().precioTotal || 0; });
    totalSubs = results[1].size;
    totalOfertas = results[2].size;
    totalCupones = results[3].size;

    // Presupuestos por estado
    var estados = {Enviado:0,Aprobado:0,Señado:0,Pagado:0,Cancelado:0};
    results[0].forEach(function(d){ var e = d.data().estado||'Enviado'; if(estados[e]!==undefined) estados[e]++; });

    // Últimos 6 meses
    var meses = {};
    var ahora = new Date();
    for(var i=5;i>=0;i--){
      var d = new Date(ahora.getFullYear(), ahora.getMonth()-i, 1);
      meses[d.getMonth()+'-'+d.getFullYear()] = {label: d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'}), count:0, monto:0};
    }
    results[0].forEach(function(doc){
      var d = doc.data();
      if(!d.fecha) return;
      var fd = d.fecha.toDate();
      var key = fd.getMonth()+'-'+fd.getFullYear();
      if(meses[key]){ meses[key].count++; meses[key].monto += d.precioTotal||0; }
    });
    var maxMonto = Math.max.apply(null, Object.values(meses).map(function(m){return m.monto;}))||1;

    c.innerHTML = `
      <div class="section-header">
        <div><div class="section-title">Dashboard</div><div class="section-sub">Resumen general de la plataforma</div></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card green">
          <div class="stat-label">Total presupuestado</div>
          <div class="stat-value">${fmtPeso(montoPres)}</div>
          <div class="stat-sub">En ${totalPres} presupuesto${totalPres!==1?'s':''}</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">Presupuestos</div>
          <div class="stat-value">${totalPres}</div>
          <div class="stat-sub">${estados.Pagado} pagados · ${estados.Aprobado} aprobados</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-label">Suscriptores</div>
          <div class="stat-value">${totalSubs}</div>
          <div class="stat-sub">Esperando ofertas/cupones</div>
        </div>
        <div class="stat-card purple">
          <div class="stat-label">Promociones activas</div>
          <div class="stat-value">${totalOfertas + totalCupones}</div>
          <div class="stat-sub">${totalOfertas} oferta${totalOfertas!==1?'s':''} · ${totalCupones} cupón/es</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem">
        <div class="form-card" style="margin:0">
          <h3>Presupuestos por estado</h3>
          ${Object.keys(estados).map(function(e){
            var pct = totalPres ? Math.round(estados[e]/totalPres*100) : 0;
            var colors={Enviado:'#60A5FA',Aprobado:'#4ADE80',Señado:'#FCD34D',Pagado:'#34D399',Cancelado:'#F87171'};
            return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:70px;font-size:0.78rem;color:#A1A1AA;flex-shrink:0">'+e+'</div><div style="flex:1;background:#2A2A2E;border-radius:4px;height:8px;overflow:hidden"><div style="width:'+pct+'%;background:'+colors[e]+';height:100%;border-radius:4px;transition:width 0.5s"></div></div><div style="font-size:0.78rem;color:#FAFAFA;font-variant-numeric:tabular-nums;width:18px;text-align:right">'+estados[e]+'</div></div>';
          }).join('')}
        </div>
        <div class="form-card" style="margin:0">
          <h3>Presupuestos por mes</h3>
          <div style="display:flex;align-items:flex-end;gap:6px;height:100px">
            ${Object.values(meses).map(function(m){
              var pct = Math.round(m.monto/maxMonto*100)||3;
              return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px"><div style="font-size:0.65rem;color:#8A8479">'+fmtPeso(m.monto).replace('$','')+'</div><div style="width:100%;background:'+(m.monto>0?'#2D6A4F':'#2A2A2E')+';border-radius:4px 4px 0 0;height:'+pct+'%;transition:height 0.5s"></div><div style="font-size:0.65rem;color:#8A8479;text-align:center">'+m.label+'</div></div>';
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }).catch(function(e){ c.innerHTML='<div style="color:#F87171;padding:2rem">Error cargando dashboard: '+e.message+'</div>'; });
}

// ══════════════════════════════════════════════
// OFERTAS
// ══════════════════════════════════════════════
function loadOfertas(){
  var c = document.getElementById('main-content');
  db.collection('ofertas').orderBy('fechaCreacion','desc').get().then(function(snap){
    var items = [];
    snap.forEach(function(d){ items.push({id:d.id, data:d.data()}); });

function guardarOferta(id){
  var nombre = document.getElementById('of-nombre').value.trim();
  if(!nombre){ toast('Ingresá un nombre para la oferta', true); return; }
  var datos = {
    nombre: nombre,
    descripcion: document.getElementById('of-desc').value.trim(),
    descuento: parseInt(document.getElementById('of-descuento').value)||0,
    productos: document.getElementById('of-productos').value.trim(),
    activa: document.getElementById('of-activa').value === '1',
    fechaCreacion: id ? firebase.firestore.FieldValue.serverTimestamp() : firebase.firestore.FieldValue.serverTimestamp()
  };
  var vigencia = document.getElementById('of-vigencia').value;
  if(vigencia) datos.vigenciaHasta = firebase.firestore.Timestamp.fromDate(new Date(vigencia));

  var promise = id ? db.collection('ofertas').doc(id).update(datos) : db.collection('ofertas').add(datos);
  promise.then(function(){
    document.getElementById('modal-oferta').remove();
    toast(id ? 'Oferta actualizada ✓' : 'Oferta creada ✓');
    loadOfertas();
  }).catch(function(e){ toast('Error: '+e.message, true); });
}

function editarOferta(id){
  db.collection('ofertas').doc(id).get().then(function(doc){
    abrirModalOferta(id, doc.data());
  });
}

function eliminarOferta(id){
  if(!confirm('¿Eliminar esta oferta?')) return;
  db.collection('ofertas').doc(id).delete().then(function(){ toast('Oferta eliminada'); loadOfertas(); });
}

function generarCodigo(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = 'CHU-';
  for(var i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('cup-codigo').value = code;
}

function guardarCupon(id){
  var codigo = (document.getElementById('cup-codigo').value||'').trim().toUpperCase();
  if(!codigo){ toast('Ingresá un código', true); return; }
  var datos = {
    codigo: codigo,
    descuento: parseInt(document.getElementById('cup-descuento').value)||0,
    emailAsignado: document.getElementById('cup-email').value.trim(),
    descripcion: document.getElementById('cup-desc').value.trim(),
    activo: document.getElementById('cup-activo').value === '1',
    usosActuales: 0,
    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp()
  };
  var usosMax = parseInt(document.getElementById('cup-usos').value);
  if(usosMax > 0) datos.usosMax = usosMax;
  var vigencia = document.getElementById('cup-vigencia').value;
  if(vigencia) datos.vigenciaHasta = firebase.firestore.Timestamp.fromDate(new Date(vigencia));

  var promise = id ? db.collection('cupones').doc(id).update(datos) : db.collection('cupones').add(datos);
  promise.then(function(){
    document.getElementById('modal-cupon').remove();
    toast(id ? 'Cupón actualizado ✓' : 'Cupón creado ✓');
    loadCupones();
  }).catch(function(e){ toast('Error: '+e.message, true); });
}

function loadPresupuestos(){

    var todos = [];

    function render(){
      var filtered = todos.filter(function(e){
        if(filtroEstado!=='Todos' && e.data.estado!==filtroEstado) return false;
        if(busqueda){ var hay=(e.data.proyecto||'').toLowerCase().includes(busqueda)||(e.data.cliente||'').toLowerCase().includes(busqueda)||(e.data.email||'').toLowerCase().includes(busqueda); if(!hay) return false; }
        return true;
      });

      var tbody = document.getElementById('pres-tbody');

      tbody.innerHTML = filtered.length === 0 ? '<div class="table-empty">No hay presupuestos con ese filtro.</div>' :
        filtered.map(function(item){
          var d = item.data; var estado = d.estado||'Enviado';
          return '<div class="table-row" style="grid-template-columns:2fr 1.5fr 1fr 1fr 1fr auto">'+
            '<div><div style="font-weight:600;font-size:0.875rem">'+(d.proyecto||'Sin nombre')+'</div><div style="font-size:0.75rem;color:#8A8479;margin-top:2px">'+(d.nombre||d.email||'')+'</div></div>'+
            '<div style="font-size:0.8rem;color:#A1A1AA">'+(d.cliente||'—')+'</div>'+

            '<div><span class="pill '+(estadosColor[estado]||'pill-blue')+'">'+estado+'</span></div>'+
            '<div style="display:flex;gap:5px">'+
              '<button class="btn btn-sm btn-wa" onclick="waPresupuesto(\''+d.proyecto+'\',\''+fmtPeso(d.precioTotal)+'\')">💬</button>'+
              '<button class="btn btn-sm btn-danger" onclick="eliminarPres(\''+item.id+'\')">🗑</button>'+
            '</div>'+
          '</div>';
        }).join('');
    }

    var ESTADOS_PRES = ['Todos','Enviado','Aprobado','Señado','Pagado','Cancelado'];
    c.innerHTML = `
      <div class="section-header">
        <div>
          <div class="section-title">Todos los presupuestos</div>

        </div>
      </div>

        <input type="text" id="pres-search" placeholder="Buscar proyecto, cliente o email..." style="flex:1;min-width:200px;background:#1C1C1F;border:1px solid #2A2A2E;border-radius:8px;padding:8px 12px;color:#FAFAFA;font-family:'Outfit',sans-serif;font-size:0.875rem;outline:none" oninput="busqueda=this.value.toLowerCase();render()">

            return '<button class="btn btn-sm btn-secondary" id="fpres-'+e+'" onclick="filtroEstado=\''+e+'\';document.querySelectorAll(\'[id^=fpres]\').forEach(function(b){b.style.background=\'\'});this.style.background=\'#2D6A4F\';render()">'+(e==='Todos'?'Todos':e)+'</button>';

          </div>
          <div id="pres-tbody"></div>
        </div>
      </div>
    `;

    render();
  }).catch(function(e){ c.innerHTML='<div style="color:#F87171;padding:2rem">Error: '+e.message+'</div>'; });
}

function waPresupuesto(proyecto, monto){
  var msg = 'Hola! Te contactamos por el presupuesto de *'+proyecto+'* por '+monto+'. ¿Tenes alguna consulta?';
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');
}
function eliminarPres(id){
  if(!confirm('¿Eliminar este presupuesto?')) return;
  db.collection('presupuestos').doc(id).delete().then(function(){ toast('Presupuesto eliminado'); loadPresupuestos(); });
}
</script>
